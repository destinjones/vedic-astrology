name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run verify:ephemeris
      - run: npm test
      - run: npm run build:pages
      - name: Check that @vedic/engine packs and imports (does not publish)
        run: npm run pack -w @vedic/engine
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
