# Deploy:  cd tools/sync-worker && npx wrangler kv namespace create BLOBS   (paste the id below)
#          npx wrangler deploy
name = "jyotisha-sync"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# Serve on your own subdomain, not on workers.dev. The zone must be on Cloudflare.
workers_dev = false
routes = [{ pattern = "sync.example.com", custom_domain = true }]

[vars]
ALLOW_ORIGIN = "https://destinjones.github.io"
# Kill switch: set to "1" (or `npx wrangler secret put SYNC_DISABLED`) and every request gets 503;
# browsers then fall back to file sync and say so once.
SYNC_DISABLED = "0"

[[kv_namespaces]]
binding = "BLOBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-sync-ID rate limit: 60 requests a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
