# Opens or updates a "Version packages" pull request whenever changesets land on main.
# Merging that pull request bumps versions and writes the CHANGELOGs. Nothing is
# published to npm here; see docs/releasing.md.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
