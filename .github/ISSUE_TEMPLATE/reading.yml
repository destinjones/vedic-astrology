name: Fix or improve a reading
description: A reading that is wrong, unclear, too technical or too fatalistic.
labels: [readings]
body:
  - type: input
    id: which
    attributes: { label: Which reading, placeholder: "Saturn in the 7th house, or the id shown under it, e.g. house:saturn:7" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What is wrong with it }
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes: { label: A better version, description: "Optional. Your own words, please, not a quote from a book or site. See packages/interpretations/content/STYLE.md." }
