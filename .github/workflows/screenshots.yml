# Accepts new chart pictures after an intended visual change.
# Add the label "update screenshots" to a pull request (from a branch in this repository):
# this rebuilds the pictures on the same Linux image CI compares against, commits them to the
# branch, and removes the label. Review the pictures in the commit, then push or re-run CI
# (commits made with the workflow token do not start CI on their own).
name: Update chart screenshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  update:
    if: github.event.label.name == 'update screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Take new pictures
        run: npm run test:visual -- --update-snapshots=all
      - name: Commit them
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "Pictures unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update chart screenshots"
          git push
      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label "update screenshots"
